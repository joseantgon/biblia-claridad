<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblia Claridad — laboratorio aislado</title><style>body{font:16px system-ui;margin:20px auto;max-width:900px;padding:0 16px}button{padding:12px;margin:5px}iframe{width:100%;height:65vh;border:1px solid #aaa}pre{white-space:pre-wrap}</style><h1>Biblia Claridad — laboratorio de integración</h1><p>Vista completa original dentro de la rama de laboratorio. Las comprobaciones son de solo lectura y no modifican tus datos.</p><button id="local">Comprobar almacenamiento local</button><button id="cloud">Comprobar cuenta y versión de Supabase</button><pre id="out" role="status"></pre><iframe title="Biblia Claridad completa" src="../index.html"></iframe><script type="module">import{readAccount,inspectLocal}from './adaptador-supabase.js';const out=document.getElementById('out');document.getElementById('local').onclick=()=>{try{const x=inspectLocal();out.textContent=JSON.stringify(Object.fromEntries(Object.entries(x).map(([k,v])=>[k,{tipo:Array.isArray(v)?'array':typeof v,elementos:Array.isArray(v)?v.length:typeof v==='object'&&v?Object.keys(v).length:null}])),null,2)}catch(e){out.textContent=e.message}};document.getElementById('cloud').onclick=async()=>{try{const {user,row}=await readAccount();out.textContent='Cuenta: '+user.email+'\nVersión: '+(row?.updated_at||'sin registro')+'\nCampos: '+(row?Object.keys(row).join(', '):'ninguno')}catch(e){out.textContent=e.message}}</script></html>
