<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblia Claridad — laboratorio</title><style>body{font:16px system-ui;margin:20px auto;max-width:960px;padding:0 16px}button{padding:12px;margin:5px}iframe{width:100%;height:65vh;border:1px solid #aaa}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Biblia Claridad — laboratorio aislado</h1><p>La Biblia completa funciona en el panel inferior. El almacenamiento es del navegador. La sincronización solo se intenta con confirmación explícita.</p><button id="check">Examinar cambios y conflictos (sin escritura)</button><button id="save">Guardar cambios en Supabase (confirmar)</button><pre id="out" role="status">Sin pruebas realizadas.</pre><iframe title="Biblia Claridad completa" src="../index.html"></iframe><script type="module">import{syncWithConfirmation,watchConnection}from './puente-biblia.js';const out=document.getElementById('out');const show=x=>out.textContent=x;watchConnection(show);document.getElementById('check').onclick=async()=>{try{const r=await syncWithConfirmation(false);if(r.status==='conflict')show(JSON.stringify(r.conflicts,null,2));else show('Cuenta: '+r.state.user.email+'\nVersión: '+(r.state.row?.updated_at||'sin registro')+'\nConflictos: '+r.state.conflicts.length+'\nSin escritura.')}catch(e){show('Error: '+e.message)}};document.getElementById('save').onclick=async()=>{if(!confirm('Esta prueba escribirá datos en tu cuenta de Supabase. ¿Continuar?'))return;try{const r=await syncWithConfirmation(true);show(r.status==='conflict'?'CONFLICTOS: no se escribió. '+JSON.stringify(r.conflicts,null,2):'Guardado confirmado. Versión '+r.version)}catch(e){show('No se confirmó escritura: '+e.message+' Si hubo corte de red, vuelve a leer antes de repetir.')}}</script></html>
